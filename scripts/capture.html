<!doctype html><html lang="en"><meta charset="utf-8"><title>ValencePort capture workspace</title><style>*{box-sizing:border-box}html,body{margin:0;background:#777}button{position:absolute;top:0;left:0;width:24px;height:24px;font-size:8px;z-index:2}iframe{position:absolute;left:32px;top:32px;transform:scale(2);transform-origin:top left;border:0;display:block}</style><button type="button" onpointerdown="event.preventDefault()" onclick="window.scrollTo({left:0,top:0,behavior:'instant'})">Park</button><iframe title="ValencePort preview"></iframe><script>const p=new URLSearchParams(location.search),w=+(p.get('w')||1363),h=+(p.get('h')||950);document.body.style.width=`${w*2+64}px`;document.body.style.height=`${h*2+64}px`;const frame=document.querySelector('iframe');frame.style.width=w+'px';frame.style.height=h+'px';p.delete('w');p.delete('h');const view=p.get('view');p.delete('view');frame.src=(view==='case'?'/case-study/':'/')+'?capture=1&'+p.toString();</script></html>
